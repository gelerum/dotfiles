# Без этого файла xdg-desktop-portal не знает, какой из установленных
# бэкендов (gtk/gnome/kde — все три стоят в системе) обслуживать под niri,
# и молча не отвечает на запросы вроде FileChooser. Внешне это выглядит
# как «не открывается файловый менеджер» при попытке прикрепить файл
# в Firefox или любом другом приложении.
#
# default=gtk — берём лёгкий GTK-бэкенд без зависимости от KDE/GNOME-сессии.
# Для интерфейсов, которых gtk не реализует (например ScreenCast), portal
# сам упадёт обратно на gnome-бэкенд — он у нас тоже установлен и запущен.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
